name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    name: Unit & integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Check for missing migrations
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Unit & integration tests
        run: uv run pytest

  e2e:
    name: Browser E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run application and browser tests via Docker Compose
        run: docker compose --profile e2e up --build --exit-code-from e2e

      - name: Upload Playwright artifacts (screenshots, traces, videos)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: test-results/
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        run: docker compose --profile e2e down -v
