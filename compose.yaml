# Local development stack: a single Django service backed by SQLite
# in a named volume, plus an optional browser E2E runner. Not production.
#
#   docker compose up --build                                # application only
#   docker compose --profile e2e up --build --exit-code-from e2e   # app + E2E
services:
  web:
    build: .
    # No fixed container_name: Compose prefixes names with the project name,
    # which keeps isolated runs (e.g. -p cyberyozh-e2e) conflict-free.
    ports:
      # Host port is configurable: APP_PORT=8001 docker compose up ...
      - "${APP_PORT:-8000}:8000"
    environment:
      DJANGO_DEBUG: "true"
      # `web` is the Compose DNS name used by the e2e service; without it
      # Django rejects requests from the test container with 400 DisallowedHost.
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,0.0.0.0,web"
      DJANGO_CSRF_TRUSTED_ORIGINS: "http://localhost:${APP_PORT:-8000},http://127.0.0.1:${APP_PORT:-8000}"
      # SQLite lives in a named volume, not in the container layer.
      DJANGO_DB_PATH: /app/data/db.sqlite3
      # Load demo users/tasks/comments on start (dev-only, idempotent).
      SEED_DEMO_DATA: "1"
    volumes:
      - cyberyozh_data:/app/data
    # E2E tests must not start before migrations and demo data are ready.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/schema/', timeout=5)",
        ]
      interval: 5s
      timeout: 10s
      retries: 36
      start_period: 20s

  e2e:
    profiles: ["e2e"]
    build:
      context: .
      dockerfile: Dockerfile.e2e
    depends_on:
      web:
        condition: service_healthy
    environment:
      # Application origin inside the Compose network, never localhost.
      E2E_BASE_URL: http://web:8000
      E2E_READY_TIMEOUT: "120"
    volumes:
      # Screenshots/traces/videos of failed tests land in ./test-results.
      - ./test-results:/app/test-results
    command: ["uv", "run", "--no-sync", "pytest", "tests/e2e"]

volumes:
  cyberyozh_data:
